version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      svelte:
        patterns:
          [
            "svelte",
            "@sveltejs/*",
            "svelte-*",
            "eslint-plugin-svelte",
            "prettier-plugin-svelte",
          ]
      d3:
        patterns: ["d3-*", "@types/d3-*"]
      tooling:
        patterns: ["*"]
        exclude-patterns:
          ["svelte", "@sveltejs/*", "svelte-*", "d3-*", "@types/d3-*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /_src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
